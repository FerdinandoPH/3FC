name: Release build

# Builds 3FC and attaches 3FC.3dsx and 3FC.cia to the release. The smdh is not
# published: 3dsxtool embeds it in the 3dsx.
# workflow_dispatch does the same build but leaves the files as workflow
# artifacts, so a release can be rehearsed without publishing one.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            3FC.3dsx
            3FC.elf
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package and publish
    needs: build
    # Deliberately not in the devkitPro container: bannertool's released
    # binaries need glibc 2.39+, and building it from source wants CMake 3.28.
    # The runner image has both; the CIA only needs the ELF from the build job.
    runs-on: ubuntu-latest

    env:
      MAKEROM_VERSION: v0.19.0
      BANNERTOOL_VERSION: 1.2.3

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install bannertool and makerom
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-${MAKEROM_VERSION}/makerom-${MAKEROM_VERSION}-ubuntu_x86_64.zip"
          unzip -q -o /tmp/makerom.zip -d /usr/local/bin

          # The original Steveice10 repository is gone; this is the maintained fork.
          curl -fsSL -o /tmp/bannertool.tar.gz \
            "https://github.com/carstene1ns/3ds-bannertool/releases/download/${BANNERTOOL_VERSION}/bannertool-${BANNERTOOL_VERSION}-linux.tar.gz"
          sudo tar -xzf /tmp/bannertool.tar.gz -C /usr/local/bin --strip-components=1 \
            "bannertool-${BANNERTOOL_VERSION}-linux/bannertool"

          sudo chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool
          bannertool --version

      # Same recipe as the Makefile's `cia` target, which cannot run here
      # because it needs devkitARM. The title strings are read back from the
      # Makefile so the two cannot drift apart.
      - name: Package the cia
        run: |
          set -euo pipefail
          title=$(sed -n 's/^APP_TITLE[[:space:]]*:=[[:space:]]*//p' Makefile)
          description=$(sed -n 's/^APP_DESCRIPTION[[:space:]]*:=[[:space:]]*//p' Makefile)
          author=$(sed -n 's/^APP_AUTHOR[[:space:]]*:=[[:space:]]*//p' Makefile)
          test -n "$title" && test -n "$description" && test -n "$author"

          bannertool makebanner -i meta/banner.png -a meta/banner.wav -o banner.bnr
          bannertool makesmdh -s "$title" -l "$description" -p "$author" -i icon.png -o icon.icn
          makerom -f cia -o 3FC.cia -elf 3FC.elf -rsf meta/3FC.rsf \
            -icon icon.icn -banner banner.bnr -exefslogo -target t

      - name: Check the artifacts exist
        run: ls -l 3FC.3dsx 3FC.cia

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3FC
          path: |
            3FC.3dsx
            3FC.cia
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            3FC.3dsx
            3FC.cia
